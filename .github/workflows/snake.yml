# Gera a animação "cobrinha" das contribuições do GitHub
# Local no repositório: .github/workflows/snake.yml
name: Gerar cobrinha de contribuições

on:
  schedule:
    - cron: "0 3 * * *"   # Executa diariamente às 03:00 UTC
  workflow_dispatch:       # Permite execução manual pela aba Actions

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # Necessário para publicar na branch "output"
    steps:
      - name: Gerar SVGs da cobrinha
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
